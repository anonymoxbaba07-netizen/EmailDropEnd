services:
  - type: web
    name: form-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node formBackend.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: RESEND_API_KEY
        sync: false   # set in Render dashboard
      - key: NOTIFY_EMAIL
        sync: false   # set in Render dashboard
      - key: SENDER_EMAIL
        sync: false   # optional; defaults to onboarding@resend.dev
