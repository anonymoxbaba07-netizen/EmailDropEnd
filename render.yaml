services:
  - type: web
    name: form-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node formBackend.js
    envVars:
      - key: PORT
        value: 3000
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false   # set manually in Render dashboard
      - key: SMTP_PASS
        sync: false   # set manually in Render dashboard
      - key: NOTIFY_EMAIL
        sync: false   # set manually in Render dashboard
